<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MC UI · harness Sidebar</title>
<style>
  /* CSS hostil, simulando o Bubble */
  body { margin: 0; font-family: "Times New Roman", serif; background: #f6f7fb; }
  a { color: red; text-decoration: underline; }
  nav, aside { background: yellow; }
  .page { display: flex; min-height: 100vh; }
  #side { flex: none; width: 240px; height: 40px; }
  .content { flex: 1; padding: 24px; }
  .content header { height: 56px; border-bottom: 1px solid #ddd; display: flex; justify-content: flex-end; align-items: center; }
  #log { font: 12px monospace; background: #222; color: #0f0; padding: 8px; height: 120px; overflow: auto; }
</style>
<script src="../dist/mc-ui-bubble.js"></script>
</head>
<body>
<div class="page">
  <div id="side"></div>
  <div class="content">
    <header>itens da direita do header (Bubble)</header>
    <h1>Conteúdo</h1>
    <p>Largura reservada pelo Bubble acompanha o estado <code>collapsed</code>.</p>
    <pre id="log"></pre>
  </div>
</div>
<script>
  window.bubbleLog = [];
  function log(m) { bubbleLog.push(m); var el = document.getElementById("log"); el.textContent += m + "\n"; }
  // Lista no formato do Bubble (não é array)
  function blist(arr) { return { length: function () { return arr.length; }, get: function (s, n) { return arr.slice(s, s + n); } }; }
  (async function () {
    var src = await (await fetch("../plugin/element-code.js")).text();
    var fns = new Function(src.split("COMPONENT").join("Sidebar") + "\nreturn {initialize: initialize, update: update};")();
    var div = document.getElementById("side");
    var inst = {
      canvas: [div], data: {}, states: {},
      publishState: function (k, v) {
        inst.states[k] = v; log("state " + k + " = " + JSON.stringify(v));
        if (k === "collapsed") div.style.width = v ? "72px" : "240px"; // condicional do Bubble
      },
      triggerEvent: function (e) { log("event " + e); },
    };
    fns.initialize(inst, {});
    var props = {
      labels: blist(["Dashboard", "Banking", "Cadastro", "Catálogo", "Estoque", "Rastreamento", "Investidor"]),
      icons: blist(["home", "bank", "folder-open", "book", "cubes", "map-pin", "briefcase"]),
      hrefs: blist(["dashboard", "banking-dash", "cadastro", "catalogo", "estoque", "https://www.riscomodocorre.com.br", ""]),
      active: "catalogo",
      logo_url: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f3cd.svg",
      logo_mark_url: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f3cd.svg",
      home_href: "dashboard",
      storage_key: "mc-harness-sidebar",
      mobile_trigger: true,
      bubble: {},
    };
    fns.update(inst, props, {});
    window.harness = { inst: inst, set: function (p) { Object.assign(props, p); fns.update(inst, props, {}); } };
    window.harnessReady = true;
  })();
</script>
</body>
</html>
